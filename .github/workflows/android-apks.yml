name: Android APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nautrix-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/adblock_android -> target

      - name: Verify project contract
        run: python3 scripts/verify_project.py

      - name: Test native adblock engine
        run: cargo test --manifest-path native/adblock_android/Cargo.toml

      - name: Build adblock-rust for Android
        working-directory: native/adblock_android
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk \
            --target arm64-v8a \
            --target armeabi-v7a \
            --target x86_64 \
            --output-dir ../../app/src/main/jniLibs \
            build --release

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NAUTRIX_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NAUTRIX_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NAUTRIX_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NAUTRIX_RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/nautrix-release.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && \
             [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            STORE_PASSWORD="nautrix-ci-store"
            KEY_ALIAS="nautrix-ci"
            KEY_PASSWORD="nautrix-ci-key"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Nautrix CI,OU=CI,O=Nautrix,L=CI,ST=CI,C=BR"
          fi
          echo "NAUTRIX_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "NAUTRIX_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NAUTRIX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NAUTRIX_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Java tests and build APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Verify and name APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Nautrix-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Nautrix-release.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose dist/Nautrix-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose dist/Nautrix-release.apk
          sha256sum dist/Nautrix-debug.apk dist/Nautrix-release.apk > dist/SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nautrix-debug
          path: |
            dist/Nautrix-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nautrix-release
          path: |
            dist/Nautrix-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
