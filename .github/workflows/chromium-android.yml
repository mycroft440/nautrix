name: Chromium Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - 'integration/**'
    paths:
      - '.github/workflows/chromium-android.yml'
      - 'config/**'
      - 'native/**'
      - 'overlays/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/chromium-android.yml'
      - 'config/**'
      - 'native/**'
      - 'overlays/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: chromium-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Repository invariants
        run: python3 scripts/verify_repo.py
      - name: Shell syntax
        run: |
          bash -n scripts/bootstrap_chromium.sh
          bash -n scripts/apply_overlays.sh
          bash -n scripts/build_android.sh
          bash -n scripts/build_vanilla_android.sh
          bash -n scripts/build_adblock_android.sh
          bash -n scripts/build_libtorrent_android.sh

  full-build:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/'))
    # First prove a completely upstream Chromium APK. Nautrix overlays and
    # optional Rust/libtorrent modules are deliberately excluded from this job.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NINJA_SUMMARIZE_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Configure work directory
        run: echo "NAUTRIX_WORK=$RUNNER_TEMP/nautrix-work" >> "$GITHUB_ENV"
      - name: Reclaim hosted-runner disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h /
      - name: Bootstrap pinned Chromium
        run: ./scripts/bootstrap_chromium.sh "$NAUTRIX_WORK"
      - name: Verify pinned revision and upstream capabilities
        run: python3 scripts/verify_repo.py --chromium-src "$NAUTRIX_WORK/chromium/src"
      - name: Build upstream Chromium baseline APK
        run: ./scripts/build_vanilla_android.sh "$NAUTRIX_WORK/chromium/src" NautrixVanilla
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find "$NAUTRIX_WORK/chromium/src/out/NautrixVanilla/apks" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" artifacts/Nautrix-Chromium-vanilla-arm64.apk
          sha256sum artifacts/Nautrix-Chromium-vanilla-arm64.apk > artifacts/Nautrix-Chromium-vanilla-arm64.apk.sha256
          printf '%s\n' "$(cat config/chromium_revision.txt)" > artifacts/chromium-revision.txt
          printf '%s\n' "$(cat config/depot_tools_revision.txt)" > artifacts/depot-tools-revision.txt
      - name: Build diagnostics
        if: always()
        run: |
          df -h /
          du -sh "$NAUTRIX_WORK/chromium/src" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Nautrix-Chromium-vanilla-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
