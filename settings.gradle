pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://dl.frostwire.com/maven"
            content { includeGroup "com.frostwire" }
        }
    }
}

rootProject.name = "Nautrix"
include(":app")
